# Render web service (free plan). Docker keeps the build reproducible and lets
# the same image run on any other host. The image is deliberately slim: the live
# app needs pandas/scikit-learn, not lightgbm or pyquotex, so those are omitted.
services:
  - type: web
    name: forex-candle-predictor
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_SOURCE
        value: tradingview
      # 0.65: measured net-positive ROI on 5 of 6 pair/interval combos vs 3 of 6
      # at 0.60. Fewer signals, but the ones printed are more often right.
      - key: MIN_CONF
        value: "0.65"
      - key: HISTORY_HOURS
        value: "72"
      - key: RETRAIN_EVERY
        value: "60"
      - key: WEB_PAIRS
        value: EURUSD,GBPUSD,USDJPY,AUDUSD,USDCHF,USDCAD
      - key: WEB_INTERVALS
        value: 1m,5m,15m
      - key: LEDGER_ENABLED
        value: "1"
      # Keep the paper-trading record across redeploys: a Render disk mounted at
      # /var/data, with the ledger written inside it. On the free plan a disk is
      # not available; the record then resets on deploy, which is acceptable for
      # a demo but not for a long-running scoreboard.
      - key: LEDGER_PATH
        value: /var/data/ledger.jsonl
