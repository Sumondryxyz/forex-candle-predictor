# Keep the Render free web service awake.
#
# A Render free service spins down after 15 minutes without INBOUND traffic. The
# predictor only makes outbound TradingView websocket connections, so without a
# ping the feed would sleep and stop predicting. This pings the health endpoint
# every 5 minutes.
#
# One-time setup: add a repository secret named RENDER_URL set to your service
# base URL, e.g. https://forex-candle-predictor.onrender.com (no trailing slash).
name: keep-awake

on:
  schedule:
    # GitHub's shortest interval. Every 5 minutes leaves margin for the
    # scheduling delay GitHub adds under load, so the service never reaches
    # its 15-minute idle window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Render service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret is not set; skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$RENDER_URL/api/health")
          echo "GET $RENDER_URL/api/health -> $code"
          test "$code" = "200"
