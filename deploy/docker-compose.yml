services:
  predictor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex-candle-predictor
    ports:
      - "12000:12000"
    environment:
      PORT: "12000"
      HOST: "0.0.0.0"
      MIN_CONF: "0.70"
      HISTORY_HOURS: "72"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:12000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
